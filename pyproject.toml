[project]
name = "quant-bot"
version = "0.1.0"
description = "台股 / 美股 / 加密貨幣 量化研究與自動化交易工具"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.11.0",
    "html5lib>=1.1",
    "lxml>=6.1.3",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "requests>=2.34.2",
    "yfinance>=1.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quant_bot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]
